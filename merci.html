<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci pour votre préinscription</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .thank-you-container {
      background: white;
      padding: 3rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    h1 {
      color: #1e3c72;
      margin-bottom: 1rem;
    }
    p {
      color: #555;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    .icon {
      font-size: 4rem;
      color: #2ad370;
      margin-bottom: 1rem;
    }
    .btn {
      background: #1e3c72;
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #2a5298;
    }
  </style>
  
</head>
<body>
  <div class="thank-you-container">
    <div class="icon">✓</div>
    <h1>Merci pour  votre préinscription !</h1>
    <p>Nous avons bien reçu votre demande. Un conseiller vous contactera sur WhatsApp dans 24 heures.</p>
    <a href="index.html" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
